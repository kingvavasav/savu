<!-- FEATURE WEB CHART (ADDITIVE) - Lightweight Charts standalone, READ-ONLY viz -->
<!-- injected before </body> by dashboard_gen patch (or standalone). Mobile-first. -->
<div id="chart-panel" style="margin:16px 0 8px;">
  <div id="chart-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <span style="font-size:13px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;">📈 Chart</span>
    <span id="chart-sel-label" style="font-size:12px;color:#e6edf3;font-weight:600;"></span>
  </div>
  <div id="pos-select" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;"></div>
  <div id="tf-select" style="display:flex;gap:6px;margin-bottom:8px;">
    <button class="tf-btn" data-tf="1h" style="flex:1;background:#1d9bf0;color:#fff;border:none;border-radius:8px;padding:8px;font-size:12px;font-weight:600;">1H</button>
    <button class="tf-btn" data-tf="4h" style="flex:1;background:#21262d;color:#e6edf3;border:none;border-radius:8px;padding:8px;font-size:12px;font-weight:600;">4H</button>
    <button class="tf-btn" data-tf="1d" style="flex:1;background:#21262d;color:#e6edf3;border:none;border-radius:8px;padding:8px;font-size:12px;font-weight:600;">1D</button>
  </div>
  <div id="chart-meta" style="font-size:12px;color:#8b949e;margin-bottom:6px;"></div>
  <div id="chart" style="width:100%;height:320px;background:#161b22;border:1px solid #21262d;border-radius:12px;overflow:hidden;"></div>
  <div id="chart-err" style="color:#f85149;font-size:12px;margin-top:6px;"></div>
  <div style="font-size:11px;color:#6e7681;margin-top:4px;">MARKET DISPLAY PRICE (bukan keputusan approval/risk). NOW = canonical futures.</div>
</div>
<script>
(function(){
  var RM_URL = "feature_readmodel.json";
  var LWC = window.LightweightCharts;
  if(!LWC){ document.getElementById('chart-err').textContent = "LWC asset gagal load"; return; }
  var chart, series, current = {pos:null, tf:"1h"};
  var rm = null;

  function fmt(v){ return (v==null) ? "UNKNOWN" : (v>=1 ? v.toFixed(2) : v.toPrecision(4)); }

  function buildPosSelect(){
    var wrap = document.getElementById('pos-select');
    wrap.innerHTML = "";
    if(!rm || !rm.positions.length){ wrap.innerHTML = '<span style="font-size:12px;color:#8b949e">Belum ada posisi</span>'; return; }
    // tampilkan RUNNING + WAIT_LIMIT + 12 recent CLOSED
    var shown = rm.positions.filter(function(p){return p.status!=="CLOSED";})
                 .concat(rm.positions.filter(function(p){return p.status==="CLOSED";}).slice(0,12));
    shown.forEach(function(p, i){
      var b = document.createElement('button');
      var emoji = p.direction==="LONG" ? "🟢" : "🔴";
      b.textContent = emoji+" "+p.sym+" · "+p.status;
      b.dataset.idx = rm.positions.indexOf(p);
      b.style.cssText = "background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;";
      b.onclick = function(){ selectPos(parseInt(b.dataset.idx,10)); };
      wrap.appendChild(b);
    });
  }

  function priceLines(p){
    var lines = [];
    var defs = [
      ["SET", p.set, "#1d9bf0"],
      ["NOW", p.now, "#f0b429"],
      ["TP1", p.tp1, "#3fb950"],
      ["TP2", p.tp2, "#2ea043"],
      ["TP3", p.tp3, "#238636"],
      ["SL",  p.sl,  "#f85149"]
    ];
    defs.forEach(function(d){
      if(d[1]!=null){
        lines.push({ price:d[1], color:d[2], lineWidth:1, lineStyle: d[0]==="NOW"?2:0,
          axisLabelVisible:true, title:d[0] });
      }
    });
    return lines;
  }

  function markers(p){
    var m = [];
    if(p.signal_ts){
      var ts = Date.parse(p.signal_ts.replace(" ","T")+":00+07:00");
      // bin ke candle terdekat bila timestamp valid; kalau NaN -> skip (no fabricated)
      if(!isNaN(ts)) m.push({ time: Math.floor(ts/1000), position:p.direction==="LONG"?"belowBar":"aboveBar",
        color:"#8b949e", shape:p.direction==="LONG"?"arrowUp":"arrowDown", text:"SIG" });
    }
    if(p.fill_ts){
      var ft = Date.parse(p.fill_ts.replace(" ","T")+":00+07:00");
      if(!isNaN(ft)) m.push({ time: Math.floor(ft/1000), position:p.direction==="LONG"?"belowBar":"aboveBar",
        color:"#1d9bf0", shape:"circle", text:"FILL" });
    }
    if(p.exit_ts){
      var et = Date.parse(p.exit_ts.replace(" ","T")+":00+07:00");
      if(!isNaN(et)) m.push({ time: Math.floor(et/1000), position:p.direction==="LONG"?"aboveBar":"belowBar",
        color:"#f85149", shape:"circle", text:"EXIT" });
    }
    return m.sort(function(a,b){return a.time-b.time;});
  }

  function selectPos(idx){
    current.pos = idx;
    var p = rm.positions[idx];
    document.getElementById('chart-sel-label').textContent = p.sym+" "+p.direction;
    document.getElementById('chart-meta').innerHTML =
      "SRC "+ (p.source||"?") +" · LEV x"+ (p.lev||5) +" · CONF "+(p.conf!=null?p.conf.toFixed(0):"?")+
      "<br>SET "+fmt(p.set)+" · NOW "+(p.now!=null?fmt(p.now)+" ("+(p.now_source||"?")+")":"UNKNOWN")+
      " · STATUS "+p.status+" · UPD "+ (rm.generated||"?");
    Array.prototype.forEach.call(document.querySelectorAll('#pos-select button'), function(b){
      b.style.background = (parseInt(b.dataset.idx,10)===idx) ? "#30363d" : "#21262d";
    });
    loadChart();
  }

  function loadChart(){
    var p = rm.positions[current.pos];
    if(!p) return;
    var sym = p._nsym || p.sym;
    var url = "https://data-api.binance.vision/api/v3/klines?symbol="+sym.toUpperCase()+"USDT"+
              "&interval="+current.tf+"&limit=150";
    fetch(url).then(function(r){ return r.json(); }).then(function(raw){
      if(!raw || !raw.length) throw new Error("no candles");
      var data = raw.map(function(k){ return { time:Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4] }; });
      if(!chart){
        chart = LWC.createChart(document.getElementById('chart'), {
          layout:{ background:{color:"#161b22"}, textColor:"#e6edf3" },
          grid:{ vertLines:{color:"#21262d"}, horzLines:{color:"#21262d"} },
          rightPriceScale:{ borderColor:"#30363d" }, timeScale:{ borderColor:"#30363d" },
          autoSize:true,
          crosshair:{ mode:LWC.CrosshairMode ? LWC.CrosshairMode.Normal : 0 }
        });
        series = chart.addCandlestickSeries({ upColor:"#3fb950", downColor:"#f85149", borderVisible:false,
          wickUpColor:"#3fb950", wickDownColor:"#f85149" });
      }
      series.setData(data);
      series.setPriceLines(priceLines(p));
      series.setMarkers(markers(p));
      chart.timeScale().fitContent();
      document.getElementById('chart-err').textContent = "";
    }).catch(function(e){
      document.getElementById('chart-err').textContent = "Candle UNKNOWN ("+current.tf+" "+sym+") - fail closed";
    });
  }

  document.querySelectorAll('.tf-btn').forEach(function(b){
    b.onclick = function(){
      current.tf = b.dataset.tf;
      document.querySelectorAll('.tf-btn').forEach(function(x){ x.style.background = (x===b)?"#1d9bf0":"#21262d"; });
      loadChart();
    };
  });

  fetch(RM_URL).then(function(r){ return r.json(); }).then(function(d){
    rm = d;
    if(!rm.positions || !rm.positions.length){ document.getElementById('chart-err').textContent="Belum ada posisi"; return; }
    buildPosSelect();
    // default: posisi RUNNING pertama, else first
    var def = rm.positions.findIndex(function(p){return p.status==="RUNNING";});
    if(def<0) def = 0;
    selectPos(def);
  }).catch(function(e){
    document.getElementById('chart-err').textContent = "read-model UNKNOWN (gagal load)";
  });
})();
</script>
